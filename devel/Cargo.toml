[package]
name = "float16-benchmark"
version = "0.0.1"
authors = ["Alex Huszagh <ahuszagh@gmail.com>"]
edition = "2021"
publish = false
rust-version = "1.86"

[features]
std = ["float16/std"]

[dependencies.float16]
path = ".."
default-features = false
features = []

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"

[[bench]]
name = "convert"
path = "convert.rs"
harness = false
